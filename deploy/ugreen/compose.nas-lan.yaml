services:
  ledger:
    image: asset-tracker:3.3.0
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${NAS_IP:?Set the private LAN address of your NAS}:${NAS_PORT:-8789}:8789"
    environment:
      ASSET_BOOTSTRAP_TOKEN: "${ASSET_BOOTSTRAP_TOKEN:?Set a unique random bootstrap token in .env}"
      ASSET_ALLOWED_ORIGINS: "${ASSET_ALLOWED_ORIGINS:-}"
      ASSET_ALLOW_DESKTOP: "0"
      ASSET_LAN_ORIGIN: "http://${NAS_IP:?Set the private LAN address of your NAS}:${NAS_PORT:-8789}"
    volumes:
      - ledger-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  ledger-data:
